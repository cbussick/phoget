services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: phoget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phoget_local}
      POSTGRES_DB: phoget
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - phoget-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoget"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  phoget-data:
